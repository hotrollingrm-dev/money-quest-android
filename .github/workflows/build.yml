name: Build MONEY QUEST

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test calculations (salary, tax, debt, available-to-spend, missions)
        run: node web-src/test.js

      - name: Build web app
        run: node tools/build-web.js ${{ github.run_number }}

      - name: Check signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ยังไม่ได้ใส่ KEYSTORE_BASE64 ใน Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: moneyquest
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package release files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/money-quest.apk
          (cd www && zip -qr ../out/web.zip .)
          NOTES=$(git log -1 --pretty=%s)
          node -e 'const fs=require("fs");const n=+fs.readFileSync("native-version.txt","utf8").trim();fs.writeFileSync("out/manifest.json",JSON.stringify({web:+process.argv[1],native:n,minNative:n,notes:process.argv[2],built:new Date().toISOString()},null,1))' "${{ github.run_number }}" "$NOTES"
          cat out/manifest.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MONEY QUEST v${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            out/money-quest.apk
            out/web.zip
            out/manifest.json
          make_latest: true
